name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite needs 22.13+ unflagged; the tests open a real in-memory database.
          node-version: 22
          cache: npm
      # Typecheck and unit tests don't need the Electron binary.
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  macos:
    # The code runner's sandbox is macOS's (Seatbelt), so its tests are skipped on Linux and run here, against the
    # runner image's own Python 3.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm test
        env:
          # A sandboxed git run takes a few seconds on this runner and sometimes more; the panel's own 10 s limit is
          # for a user's Mac, so lengthen it here rather than let a slow minute fail the build.
          OLLMOST_GIT_MS: 60000
